<div class="segmented" role="tablist" aria-label="About me" hidden>
    <button type="button" role="tab" id="tab-outside-of-work" aria-controls="outside-of-work" aria-selected="true">🌹 Outside of work</button>
    <button type="button" role="tab" id="tab-how-i-got-here" aria-controls="how-i-got-here" aria-selected="false" tabindex="-1">🪜 How I got here</button>
</div>
<script>
(function () {
    var list = document.currentScript.previousElementSibling;
    var tabs = Array.prototype.slice.call(list.querySelectorAll('[role="tab"]'));

    function select(tab, moveFocus) {
        tabs.forEach(function (other) {
            var selected = other === tab;
            other.setAttribute("aria-selected", selected ? "true" : "false");
            other.tabIndex = selected ? 0 : -1;
            var panel = document.getElementById(other.getAttribute("aria-controls"));
            if (panel) panel.hidden = !selected;
        });
        if (moveFocus) tab.focus();
        // Keep the choice in the URL, so /about/#how-i-got-here opens on that tab.
        history.replaceState(null, "", "#" + tab.getAttribute("aria-controls"));
    }

    tabs.forEach(function (tab, index) {
        tab.addEventListener("click", function () { select(tab, false); });
        tab.addEventListener("keydown", function (event) {
            var next = null;
            if (event.key === "ArrowRight") next = tabs[(index + 1) % tabs.length];
            if (event.key === "ArrowLeft") next = tabs[(index - 1 + tabs.length) % tabs.length];
            if (next) { event.preventDefault(); select(next, true); }
        });
    });

    // The panels come after this script, so set things up once the page has loaded.
    document.addEventListener("DOMContentLoaded", function () {
        list.hidden = false;
        var fromHash = tabs.filter(function (tab) {
            return "#" + tab.getAttribute("aria-controls") === location.hash;
        })[0];
        var start = fromHash || tabs[0];
        tabs.forEach(function (tab) {
            var panel = document.getElementById(tab.getAttribute("aria-controls"));
            if (panel) panel.hidden = tab !== start;
            tab.setAttribute("aria-selected", tab === start ? "true" : "false");
            tab.tabIndex = tab === start ? 0 : -1;
        });
    });
})();
</script>
